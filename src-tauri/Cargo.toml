[package]
name = "starrytools"
version = "0.1.0"
description = "节点式小工具集合"
authors = ["falsw"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "starrytools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# PNG 无损优化直接用到这几样（都是 image 已经带进来的同一份，不额外拉版本）：
# png 负责写容器与逐行 filter，flate2 用来在 zopfli 重压缩前解开 IDAT，
# crc32fast 给自己拼的块算 CRC，zopfli 只在「极限」档用。
png = "0.18"
flate2 = "1"
crc32fast = "1"
zopfli = "0.8"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "qoi",
    "tga",
    "pnm",
    "rayon",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
