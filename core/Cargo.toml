[package]
name = "starrytools-core"
version = "0.1.0"
description = "StarryTools 的核心：类型系统、节点定义、执行引擎、PNG 优化"
authors = ["falsw"]
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "starrytools_core"

[features]
default = ["onnx", "video"]
# ONNX 推理（背景移除）。`tract` 是纯 Rust，不需要额外装原生库。
onnx = ["dep:tract-onnx"]
# 视频处理（调用外部 ffmpeg 可执行文件，不引入任何 crate）。
video = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# PNG 无损优化直接用到这几样（都是 image 已经带进来的同一份，不额外拉版本）：
# png 负责写容器与逐行 filter，flate2 用来在 zopfli 重压缩前解开 IDAT，
# crc32fast 给自己拼的块算 CRC，zopfli 只在「极限」档用。
png = "0.18"
flate2 = "1"
crc32fast = "1"
zopfli = "0.8"
# 数据目录（工作流、模型都放在它底下）。
dirs = "7"
# 下载 ONNX 模型（背景移除用）。
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
] }
# 纯 Rust 的 ONNX 运行时 —— 背景移除要跑 u2net 模型。不需要这个功能的话，
# 可以用 `--no-default-features` 把它整个去掉（节点会给出提示而不是报错）。
tract-onnx = { version = "0.23", optional = true }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "qoi",
    "tga",
    "pnm",
    "rayon",
] }
